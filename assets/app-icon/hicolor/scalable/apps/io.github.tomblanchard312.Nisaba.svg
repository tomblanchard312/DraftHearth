<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Nisaba app icon: a clay tablet with three lines of wedge-shaped (cuneiform-like) marks and a
       reed stylus, on a night-indigo tile. Original artwork for this repository (MIT OR Apache-2.0).
       Full-bleed 512 tile with rx=112, the shape packaging/icons.sh expects. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2F7A"/>
      <stop offset="1" stop-color="#1B1640"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2D6AE"/>
      <stop offset="1" stop-color="#D9AF7C"/>
    </linearGradient>
    <linearGradient id="reed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6CF6A"/>
      <stop offset="1" stop-color="#C9922E"/>
    </linearGradient>
    <!-- One wedge: a triangular head pressed into the clay with a short tail. -->
    <g id="wedge">
      <path d="M0 -13 L26 0 L0 13 Z" fill="#7A4A26"/>
      <rect x="20" y="-3" width="26" height="6" rx="3" fill="#7A4A26"/>
    </g>
    <g id="down">
      <path d="M-12 0 L0 24 L12 0 Z" fill="#7A4A26"/>
      <rect x="-3" y="18" width="6" height="24" rx="3" fill="#7A4A26"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- Tablet, slightly turned, with a soft shadow. -->
  <g transform="rotate(-6 256 248)">
    <rect x="118" y="92" width="276" height="318" rx="46" fill="#000" opacity="0.28" transform="translate(10 14)"/>
    <rect x="118" y="92" width="276" height="318" rx="46" fill="url(#clay)"/>
    <rect x="132" y="106" width="248" height="290" rx="36" fill="none" stroke="#C99A62" stroke-width="4" opacity="0.7"/>

    <!-- Three lines of marks. -->
    <use href="#wedge" transform="translate(160 164)"/>
    <use href="#down" transform="translate(236 146)"/>
    <use href="#wedge" transform="translate(262 164)"/>
    <use href="#wedge" transform="translate(320 164) scale(0.8)"/>

    <use href="#down" transform="translate(172 214)"/>
    <use href="#wedge" transform="translate(196 232)"/>
    <use href="#wedge" transform="translate(258 232) scale(0.8)"/>
    <use href="#down" transform="translate(328 214)"/>

    <use href="#wedge" transform="translate(160 300)"/>
    <use href="#wedge" transform="translate(222 300) scale(0.8)"/>
    <use href="#down" transform="translate(286 282)"/>
  </g>

  <!-- Reed stylus across the lower right, its cut tip touching the last line. -->
  <g transform="rotate(-38 360 380)">
    <rect x="300" y="362" width="170" height="30" rx="15" fill="#000" opacity="0.25" transform="translate(6 10)"/>
    <rect x="300" y="362" width="170" height="30" rx="15" fill="url(#reed)"/>
    <path d="M300 362 L262 377 L300 392 Z" fill="#B07A22"/>
    <rect x="352" y="362" width="5" height="30" fill="#9C6A1C" opacity="0.6"/>
    <rect x="410" y="362" width="5" height="30" fill="#9C6A1C" opacity="0.6"/>
  </g>
</svg>
