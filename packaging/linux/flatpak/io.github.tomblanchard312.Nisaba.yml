# Flatpak manifest for DraftHearth, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.tomblanchard312.Nisaba.yml
#   flatpak run io.github.tomblanchard312.Nisaba
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The release's .flatpak bundles come from io.github.tomblanchard312.Nisaba.bundle.yml instead (see there);
# keep runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: io.github.tomblanchard312.Nisaba
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: wordcraft
finish-args:
  # On-demand Hugging Face model downloads.
  - --share=network
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents and Pictures are granted so files passed by path (the command
  # line, Open Recent, "Save" next to the original) work in the usual places.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  # Models downloaded or added by the user, matching the native per-user model folder.
  - --filesystem=xdg-data/nisaba
  # Shared Enki on the host. The launcher installs or updates it and uses its socket.
  # A newer Enki already installed is left as it is.
  - --filesystem=xdg-data/enki:create
  - --filesystem=xdg-data/SharedAI:create
  - --filesystem=xdg-run/sharedai:create
  - --filesystem=/usr/lib/enki:ro
  - --talk-name=org.freedesktop.Flatpak
  # Home/host filesystem access remains restricted.

modules:
  - name: wordcraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/wordcraft/cargo
        CARGO_NET_OFFLINE: 'true'
        # The interface translations (the craft-i18n source below), embedded by build.rs.
        CRAFT_I18N_DIR: /run/build/wordcraft/craft-i18n
        CRAFT_I18N_REQUIRED: '1'
    build-commands:
      - cargo --offline build --release --locked -p wordcraft -p wordcraft-cli
      - install -Dm755 target/release/wordcraft /app/bin/nisaba-bin
      # The release bundle copies Enki into /app/lib/enki-payload. This from-source build does not
      # compile Enki; the launcher runs DraftHearth, and installs Enki when that payload is present.
      - install -Dm755 packaging/linux/enki-flatpak-launch.sh /app/bin/nisaba
      - install -Dm755 target/release/wordcraft-cli /app/bin/nisaba-cli
      - install -Dm644 packaging/linux/io.github.tomblanchard312.Nisaba.desktop /app/share/applications/io.github.tomblanchard312.Nisaba.desktop
      - install -Dm644 packaging/linux/io.github.tomblanchard312.Nisaba.mime.xml /app/share/mime/packages/io.github.tomblanchard312.Nisaba.xml
      - install -Dm644 NOTICE /app/share/doc/nisaba/NOTICE
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.tomblanchard312.Nisaba.metainfo.xml.in > /app/share/metainfo/io.github.tomblanchard312.Nisaba.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      # The interface translations at the commit in craft-i18n.rev (a test keeps the two equal).
      - type: git
        url: https://github.com/storytold/craft-i18n
        commit: 9205108cfdced5177706264038848b68b2422d2b
        dest: craft-i18n
      - cargo-sources.json
